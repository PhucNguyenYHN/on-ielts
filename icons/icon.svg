<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Nền: tím → xanh ngọc, có quầng sáng góc trên -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="0.55" stop-color="#5b3df5"/>
      <stop offset="1" stop-color="#00b3a4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Bong bóng thoại: mặt trước sáng, cạnh dày tạo khối -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ddff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4dff"/>
      <stop offset="1" stop-color="#3d1fc4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient>
    <linearGradient id="badgeSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2456a"/>
      <stop offset="1" stop-color="#b8264c"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1a0b5c" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#2a1080" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- hạt sáng trang trí -->
  <g fill="#ffffff">
    <circle cx="430" cy="92" r="7" opacity="0.8"/>
    <circle cx="462" cy="140" r="4" opacity="0.6"/>
    <circle cx="70" cy="420" r="5" opacity="0.5"/>
    <path d="M96 96 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" opacity="0.85"/>
  </g>

  <!-- Bong bóng thoại 3D -->
  <g filter="url(#drop)">
    <!-- cạnh dày (khối phía dưới) -->
    <path d="M140 130 h232 a52 52 0 0 1 52 52 v118 a52 52 0 0 1 -52 52 h-118 l-64 54 a10 10 0 0 1 -16 -9 l10 -45 h-44 a52 52 0 0 1 -52 -52 v-118 a52 52 0 0 1 52 -52z"
          transform="translate(0 22)" fill="url(#side)"/>
    <!-- mặt trước -->
    <path d="M140 130 h232 a52 52 0 0 1 52 52 v118 a52 52 0 0 1 -52 52 h-118 l-64 54 a10 10 0 0 1 -16 -9 l10 -45 h-44 a52 52 0 0 1 -52 -52 v-118 a52 52 0 0 1 52 -52z"
          fill="url(#face)"/>
    <!-- vệt bóng sáng -->
    <path d="M140 146 h232 a36 36 0 0 1 36 36 v14 c-90 26 -200 26 -304 6 v-20 a36 36 0 0 1 36 -36z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Chữ trên bong bóng -->
  <text x="256" y="292" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Segoe UI, sans-serif" font-weight="900" font-size="128" letter-spacing="-4" fill="#2a1080" opacity="0.18" transform="translate(0 6)">Hi!</text>
  <text x="256" y="292" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Segoe UI, sans-serif" font-weight="900" font-size="128" letter-spacing="-4" fill="url(#txt)">Hi!</text>

  <!-- Sóng âm hai bên -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#soft)">
    <path d="M58 214 q-20 34 0 68" stroke-width="12" opacity="0.9"/>
    <path d="M30 196 q-30 52 0 104" stroke-width="10" opacity="0.55"/>
    <path d="M454 214 q20 34 0 68" stroke-width="12" opacity="0.9"/>
    <path d="M482 196 q30 52 0 104" stroke-width="10" opacity="0.55"/>
  </g>

  <!-- Huy hiệu micro góc dưới phải -->
  <g filter="url(#drop)">
    <circle cx="392" cy="402" r="62" fill="url(#badgeSide)" transform="translate(0 10)"/>
    <circle cx="392" cy="402" r="62" fill="url(#badge)"/>
    <ellipse cx="380" cy="372" rx="38" ry="18" fill="#ffffff" opacity="0.35"/>
    <rect x="374" y="364" width="36" height="58" rx="18" fill="#ffffff"/>
    <path d="M360 404 a32 32 0 0 0 64 0" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M392 436 v14 M376 450 h32" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
